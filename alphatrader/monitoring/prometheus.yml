# monitoring/prometheus.yml
# --------------------------
# Prometheus scrape configuration for AlphaTrader.
# Scrapes the backend /metrics endpoint every 15 seconds.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── AlphaTrader Backend ──────────────────────────────────────────
  - job_name: "alphatrader-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # ── Prometheus self-monitoring ───────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
